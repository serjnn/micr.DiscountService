version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: discount-postgres
    environment:
      POSTGRES_DB: micr-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d micr-db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - discount-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: discount-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - discount-net

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: discount-zipkin
    ports:
      - "9411:9411"
    networks:
      - discount-net

  prometheus:
    image: prom/prometheus:latest
    container_name: discount-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - discount-net

  discount-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discount-service
    ports:
      - "7005:7005"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/micr-db?currentSchema=discount_schema
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      EUREKA_SERVER_URL: http://localhost:8761/eureka/
      SERVER_PORT: 7005
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - discount-net

networks:
  discount-net:
    driver: bridge

volumes:
  postgres-data:
