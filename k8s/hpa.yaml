apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: discount-service-hpa
  labels:
    app: discount-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: discount-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
