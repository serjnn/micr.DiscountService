apiVersion: apps/v1
kind: Deployment
metadata:
  name: discount-service
  labels:
    app: discount-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: discount-service
  template:
    metadata:
      labels:
        app: discount-service
    spec:
      containers:
        - name: discount-service
          image: discount-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7005
              name: http
          envFrom:
            - configMapRef:
                name: discount-service-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: discount-service-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discount-service-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 7005
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 7005
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
